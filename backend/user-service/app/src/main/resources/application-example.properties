# Example local configuration only. Replace every placeholder before starting the backend.
spring.datasource.url=jdbc:postgresql://localhost:5432/tutoring_app
spring.datasource.username=example_user
spring.datasource.password=example_password
spring.jpa.hibernate.ddl-auto=update
server.port=8080

# Base64-encoded key for HS256 (example only; do not use in production).
jwt.secret=MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
# AES key must be exactly 16, 24, or 32 bytes.
aes.secret=replace-with-16b

# Comma-separated origins allowed for REST CORS and the STOMP/SockJS endpoint.
app.websocket.allowed-origins=http://localhost:8081,http://localhost:19006,http://localhost:5173
